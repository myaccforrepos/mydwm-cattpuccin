
backend = "glx";

vsync = true;
use-damage = true;

detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
detect-rounded-corners = true;



animations = (
    {
        triggers = [ "open", "show" ];

        opacity = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.32;
            start = 0;
            end = "window-raw-opacity";
        };

        scale-x = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.32;
            start = 0.94;
            end = 1;
        };

        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-opacity = "opacity";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
    },

    {
        triggers = [ "close", "hide" ];

        opacity = {
            curve = "cubic-bezier(0.55, 0, 1, 0.45)";
            duration = 0.22;
            start = "window-raw-opacity-before";
            end = 0;
        };

        scale-x = {
            curve = "cubic-bezier(0.55, 0, 1, 0.45)";
            duration = 0.22;
            start = 1;
            end = 0.96;
        };

        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-opacity = "opacity";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
    },

    {
        triggers = [ "geometry" ];

        suppressions = [ "geometry" ];

        offset-x = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.28;
            start = "window-x-before - window-x";
            end = 0;
        };

        offset-y = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.28;
            start = "window-y-before - window-y";
            end = 0;
        };

        scale-x = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.28;
            start = "window-width-before / window-width";
            end = 1;
        };

        scale-y = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.28;
            start = "window-height-before / window-height";
            end = 1;
        };

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
    }
);

shadow = true;

shadow-radius = 12;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.30;

shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3bar'",
  "class_g = 'Conky'",
  "name = 'Notification'",
  "name = 'rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];



fading = true;

fade-in-step = 0.03;
fade-out-step = 0.03;

fade-delta = 10;

fade-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Polybar'"
];



inactive-opacity = 0.77;
active-opacity = 0.77;
frame-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'Rofi'",
  "100:class_g = 'Polybar'"
];


blur-method = "dual_kawase";
blur-strength = 5;

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;



corner-radius = 10;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'i3bar'",
  "class_g = 'Rofi'"
];



mark-wmwin-focused = true;
mark-ovredir-focused = true;



log-level = "warn";
